<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#132a45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fa3ff"/>
      <stop offset="1" stop-color="#7f5cff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="384" height="384" rx="72" fill="url(#bg)"/>
  <rect x="8" y="8" width="384" height="384" rx="72" fill="none" stroke="#2a323d" stroke-width="2"/>

  <!-- Hexagon (Node.js shape), centered -->
  <polygon points="200,76 304,136 304,256 200,316 96,256 96,136"
           fill="none" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>

  <!-- dvwa letters inside the hexagon -->
  <text x="200" y="226" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="80" font-weight="700" fill="#e6ebf2">dvwa</text>

  <!-- nodejs label under the hexagon -->
  <text x="200" y="356" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="36" fill="#9fe870">nodejs</text>

  <!-- red "vulnerable" slash across the hexagon -->
  <line x1="118" y1="280" x2="282" y2="112" stroke="#ff5d5d" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
</svg>