# HARDENED — DVWA NodeJS CI (Azure DevOps)
# Reference version for the training lab docs/labs/11-poisoned-pipelines.md.
# Differences vs azure-pipelines.yml:
#   1. PR validation runs WITHOUT secrets; the secret-consuming deploy job
#      is gated to the master branch (condition + no variable group there)
#   2. No untrusted macro expansion inside inline script — untrusted values
#      pass through environment blocks, quoted
#   3. Pinned agent image
#   4. Minimal service connection scope, documented

trigger:
  branches:
    include: [master]

pr:
  branches:
    include: [master]

pool:
  vmImage: ubuntu-22.04         # pinned image

jobs:
  - job: test
    displayName: Test (no secrets — runs for PRs too)
    steps:
      - script: |
          npm install
          node --test sast/tests/ || true
        displayName: Install and test

      # SAFE: untrusted values reach the script as env vars, quoted — they
      # stay data, never shell syntax.
      - script: echo "PR from branch: $PULL_REQUEST_SOURCE_BRANCH"
        displayName: Show PR metadata (safe)
        condition: eq(variables['Build.Reason'], 'PullRequest')
        env:
          PULL_REQUEST_SOURCE_BRANCH: $(System.PullRequest.SourceBranch)

  # Deploy only for trusted-branch pushes; the variable group with secrets
  # is linked to THIS job only, never to PR validation.
  - job: deploy
    displayName: Deploy (trusted branches only)
    dependsOn: test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    variables:
      - group: nodebazaar-deploy
    steps:
      - checkout: self
      - script: |
          echo "Deploying with key ${DEPLOY_API_KEY:0:4}****"
          # ./scripts/deploy.sh — secret travels via env, not argv
        displayName: Deploy
        env:
          DEPLOY_API_KEY: $(DEPLOY_API_KEY)